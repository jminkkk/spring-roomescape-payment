services:

  # ── k6 부하 테스트 러너 ────────────────────────────────────────
  # 앱은 로컬에서 직접 실행:
  #   ./gradlew bootRun --args='--spring.profiles.active=perf'
  #
  # 앱이 httpbin.org에 아웃바운드 HTTPS 요청을 보내므로,
  # k6는 로컬 앱(host.docker.internal:8080)에만 연결하면 된다.
  k6:
    image: grafana/k6:0.52.0
    volumes:
      - ./perf-test/k6:/scripts
    environment:
      BASE_URL: http://host.docker.internal:8080
      EMAIL: hihi@naver.com
      PASSWORD: hihi
    command: run /scripts/${K6_SCRIPT:-00_smoke-verify.js}
    extra_hosts:
      - "host.docker.internal:host-gateway"
